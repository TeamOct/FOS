import com.github.nekit508.nmp.extensions.NMPluginCoreExtension

plugins {
    id "com.github.nekit508.mindustry-mod-plugin" version "$nmpVersion" apply true
}

allprojects.each {project ->
    project.repositories {
        mavenCentral()
        mavenLocal()
        maven { url "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
        maven { url "https://raw.githubusercontent.com/GglLfr/EntityAnnoMaven/main" }
        maven { url "https://www.jitpack.io" }
        maven { url "https://maven.xpdustry.com/mindustry" }
        ivy {
            url = 'https://github.com/'
            patternLayout {artifact '/[organisation]/[module]/releases/download/[revision]/MultiCrafter.jar'}
            metadataSources { artifact() }
        }
    }

    project.repositories {
        mavenCentral()
    }

    project.apply plugin: "java"
    project.apply plugin: "idea"
}

group = modGroup
version = modVersion

nmp.core project, "core"
nmp.entityAnno project, "eanno", (NMPluginCoreExtension) core

core.with {
    configureTasks {
        nmpGenerateModInfo {
            set(
                    "displayName": "Fictional Octo System",
                    "description": "This adventure will take place in the Caldemolt Star System, planet Lumoni.\n" +
                        "The faction Corru was almost driven to extinction at some point in the past, with only one core still standing. It has just awoken.\n" +
                        "Survive. Expand. Locate former Corru bases and re-discover their mysteries.\n" +
                        "Also, your core still remembers a different faction that assisted in your near demise...",
                    "author": "Team Oct",
                    "subtitle": "See you later!",
                    "repo": "TeamOct/FOS",
                    "java": true,
                    "main": "fos.core.FOSMod",
                    "hidden": false,
                    "dependencies": [ "multicrafter" ]
            )
        }

        nmpBuild.from project.file("mod.json")
        nmpBuild.from project.file("icon.png")
    }

    nmp.setting {
        modName.set gameModName
        modGroup.set group as String
        modVersion.set version as String

        mindustryVersion.set prop("mindustryVersion") as String

        generateModInfo.set true
    }

    nmp.configuration {
        dependencies {
            compileOnly nmp.arcDependency(arcVersion.get(), "discord")
            compileOnly nmp.arcDependency(arcVersion.get(), "backend-sdl")
            compileOnly 'JojoFR1:MultiCrafter:v1.5.2'
        }
    }
}

eanno.with {
    nmp.setting {
        genPackage.set modGen
        modCompsPackage.set modComps
        fetchedCompsPackage.set fetchedComps

        entityAnnoVersion.set prop("entityAnnoVersion") as String
    }
}
